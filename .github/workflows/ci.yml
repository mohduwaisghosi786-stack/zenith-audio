name: Zenith Audio CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-linux:
    name: 🐧 Build Linux Server & Debian Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libopus-dev libasound2-dev build-essential dpkg-dev

      - name: Build C++20 Zenith Server
        run: |
          cd server
          make -j$(nproc)
          ./bin/zenith-server --help || true

      - name: Build Debian Package
        run: |
          mkdir -p /tmp/deb_build/zenith-server_1.3.0_amd64/DEBIAN
          mkdir -p /tmp/deb_build/zenith-server_1.3.0_amd64/usr/bin
          mkdir -p /tmp/deb_build/zenith-server_1.3.0_amd64/usr/lib/systemd/user
          cp server/bin/zenith-server /tmp/deb_build/zenith-server_1.3.0_amd64/usr/bin/zenith-server
          strip /tmp/deb_build/zenith-server_1.3.0_amd64/usr/bin/zenith-server
          cat << 'EOF' > /tmp/deb_build/zenith-server_1.3.0_amd64/DEBIAN/control
          Package: zenith-audio-server
          Version: 1.3.0
          Section: sound
          Priority: optional
          Architecture: amd64
          Depends: libpipewire-0.3-0, libopus0
          Maintainer: Mohd Uwais Ghosi <mohduwaisghosi@gmail.com>
          Description: Zenith Ultra-Low Latency Audio Server
          EOF
          dpkg-deb --build --root-owner-group /tmp/deb_build/zenith-server_1.3.0_amd64 zenith-server_1.3.0_amd64.deb

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zenith-server-linux
          path: |
            server/bin/zenith-server
            zenith-server_1.3.0_amd64.deb

  build-android:
    name: 📱 Build Android App APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: zenith-audio-apk
          path: android/app/build/outputs/apk/release/*.apk
